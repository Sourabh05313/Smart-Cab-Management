<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bookings - Smart Cab Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #343a40;
            padding-top: 20px;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.75);
            padding: 10px 20px;
            margin: 5px 0;
        }
        .sidebar .nav-link:hover {
            color: #fff;
            background-color: rgba(255,255,255,.1);
        }
        .sidebar .nav-link.active {
            color: #fff;
            background-color: rgba(255,255,255,.1);
        }
        .main-content {
            padding: 20px;
        }
        .card {
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .table-responsive {
            margin-top: 20px;
        }
        .action-buttons .btn {
            margin-right: 5px;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.85rem;
        }
        .status-pending {
            background-color: #ffc107;
            color: #000;
        }
        .status-confirmed {
            background-color: #28a745;
            color: #fff;
        }
        .status-cancelled {
            background-color: #dc3545;
            color: #fff;
        }
        .status-completed {
            background-color: #17a2b8;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="text-center mb-4">
                    <h4 class="text-white">Smart Cab Admin</h4>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="adminDashboard.html">
                            <i class="bi bi-speedometer2 me-2"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="adminUsers.html">
                            <i class="bi bi-people me-2"></i>Users
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="adminDrivers.html">
                            <i class="bi bi-car-front me-2"></i>Drivers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="adminBookings.html">
                            <i class="bi bi-calendar-check me-2"></i>Bookings
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="adminPayments.html">
                            <i class="bi bi-credit-card me-2"></i>Payments
                        </a>
                    </li>
                    <li class="nav-item mt-auto">
                        <a class="nav-link" href="#" id="logoutBtn">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Manage Bookings</h2>
                    <div class="text-muted">
                        Welcome, <span id="adminName">Admin</span>
                    </div>
                </div>

                <!-- Filters -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <label for="statusFilter" class="form-label">Status</label>
                                <select class="form-select" id="statusFilter">
                                    <option value="">All Statuses</option>
                                    <option value="pending">Pending</option>
                                    <option value="confirmed">Confirmed</option>
                                    <option value="cancelled">Cancelled</option>
                                    <option value="completed">Completed</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="dateFilter" class="form-label">Date Range</label>
                                <input type="date" class="form-control" id="dateFilter">
                            </div>
                            <div class="col-md-3">
                                <label for="searchInput" class="form-label">Search</label>
                                <input type="text" class="form-control" id="searchInput" placeholder="Search bookings...">
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <button class="btn btn-primary w-100" id="applyFiltersBtn">
                                    Apply Filters
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Bookings Table -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">All Bookings</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>User</th>
                                        <th>Driver</th>
                                        <th>Pickup</th>
                                        <th>Destination</th>
                                        <th>Date & Time</th>
                                        <th>Status</th>
                                        <th>Amount</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="bookingsTableBody">
                                    <!-- Bookings will be loaded here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Update Booking Status Modal -->
    <div class="modal fade" id="updateStatusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Booking Status</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="updateStatusForm">
                        <div class="mb-3">
                            <label for="bookingStatus" class="form-label">Status</label>
                            <select class="form-select" id="bookingStatus" required>
                                <option value="pending">Pending</option>
                                <option value="confirmed">Confirmed</option>
                                <option value="cancelled">Cancelled</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                        <input type="hidden" id="bookingId">
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="updateStatusBtn">Update Status</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check session on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkSession();
            loadBookings();
        });

        // Check if admin is logged in
        async function checkSession() {
            try {
                showLoading();
                const response = await fetch('http://localhost:5000/api/admin/session', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('adminName').textContent = data.admin_name;
                    // Store admin name in localStorage for quick access
                    localStorage.setItem('admin_name', data.admin_name);
                    hideLoading();
                } else {
                    hideLoading();
                    showError('Session expired. Please login again.');
                    setTimeout(() => {
                        window.location.href = 'adminLogin.html';
                    }, 2000);
                }
            } catch (error) {
                console.error('Error checking session:', error);
                hideLoading();
                showError('Failed to check session. Please try again.');
                setTimeout(() => {
                    window.location.href = 'adminLogin.html';
                }, 2000);
            }
        }

        // Set up periodic session check
        setInterval(checkSession, 30000); // Check every 30 seconds

        // Load bookings
        async function loadBookings() {
            try {
                showLoading();
                const response = await fetch('http://localhost:5000/api/admin/bookings', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const tableBody = document.getElementById('bookingsTableBody');
                    tableBody.innerHTML = '';
                    
                    if (data.bookings && data.bookings.length > 0) {
                        data.bookings.forEach(booking => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${booking.booking_id}</td>
                                <td>${booking.user_name}</td>
                                <td>${booking.driver_name || '-'}</td>
                                <td>${booking.pickup_location}</td>
                                <td>${booking.destination}</td>
                                <td>${booking.booking_date} ${booking.booking_time}</td>
                                <td>
                                    <span class="status-badge status-${booking.status}">
                                        ${booking.status.charAt(0).toUpperCase() + booking.status.slice(1)}
                                    </span>
                                </td>
                                <td>₹${booking.amount || '0.00'}</td>
                                <td>
                                    <button class="btn btn-sm btn-info" onclick="viewBooking(${booking.booking_id})">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                    <button class="btn btn-sm btn-primary" onclick="updateBookingStatus(${booking.booking_id})">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                </td>
                            `;
                            tableBody.appendChild(row);
                        });
                    } else {
                        tableBody.innerHTML = '<tr><td colspan="9" class="text-center">No bookings found</td></tr>';
                    }
                    hideLoading();
                } else {
                    throw new Error('Failed to load bookings');
                }
            } catch (error) {
                console.error('Error loading bookings:', error);
                hideLoading();
                showError(error.message || 'Failed to load bookings');
            }
        }

        // Update booking status
        async function updateBookingStatus(bookingId) {
            try {
                document.getElementById('bookingId').value = bookingId;
                const modal = new bootstrap.Modal(document.getElementById('updateStatusModal'));
                modal.show();
            } catch (error) {
                console.error('Error opening update modal:', error);
                showError('Failed to open update modal');
            }
        }

        // Save updated booking status
        document.getElementById('updateStatusModal').addEventListener('hidden.bs.modal', function() {
            document.getElementById('updateStatusForm').reset();
        });

        document.getElementById('updateStatusForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            try {
                const bookingId = document.getElementById('bookingId').value;
                const status = document.getElementById('bookingStatus').value;
                
                showLoading();
                const response = await fetch(`http://localhost:5000/api/admin/bookings/${bookingId}`, {
                    method: 'PUT',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ status })
                });
                
                if (response.ok) {
                    hideLoading();
                    showSuccess('Booking status updated successfully');
                    bootstrap.Modal.getInstance(document.getElementById('updateStatusModal')).hide();
                    loadBookings();
                } else {
                    const data = await response.json();
                    throw new Error(data.error || 'Failed to update booking status');
                }
            } catch (error) {
                console.error('Error updating booking status:', error);
                hideLoading();
                showError(error.message || 'Failed to update booking status');
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            try {
                showLoading();
                const response = await fetch('http://localhost:5000/api/admin/logout', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (response.ok) {
                    // Clear localStorage
                    localStorage.removeItem('admin_name');
                    hideLoading();
                    window.location.href = 'adminLogin.html';
                } else {
                    throw new Error('Failed to logout');
                }
            } catch (error) {
                console.error('Error during logout:', error);
                hideLoading();
                showError(error.message || 'Failed to logout');
            }
        });

        // Show loading spinner
        function showLoading() {
            const spinner = document.createElement('div');
            spinner.className = 'position-fixed top-50 start-50 translate-middle';
            spinner.innerHTML = `
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            `;
            spinner.id = 'loadingSpinner';
            document.body.appendChild(spinner);
        }

        // Hide loading spinner
        function hideLoading() {
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) {
                spinner.remove();
            }
        }

        // Show error message
        function showError(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-danger alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        // Show success message
        function showSuccess(message) {
            const alert = document.createElement('div');
            alert.className = 'alert alert-success alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }
    </script>
</body>
</html>
