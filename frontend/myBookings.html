<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Bookings - Smart Cab System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/fontawesome-all.css">
    
    <!-- Fonts -->
    <link href="//fonts.googleapis.com/css?family=Raleway:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="userDashboard.html">
                    <i class="fas fa-taxi"></i> Smart Cab
                </a>
                <div class="ml-auto">
                    <span class="mr-3">Welcome, <span id="userName"></span></span>
                    <a class="nav-link" href="index.html">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Bookings Content -->
    <section class="bookings py-5">
        <div class="container py-md-5 py-3">
            <h1 class="heading text-capitalize text-center">My Bookings</h1>
            <div class="row mt-5">
                <div class="col-12">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Booking ID</th>
                                    <th>Pickup Location</th>
                                    <th>Dropoff Location</th>
                                    <th>Date</th>
                                    <th>Time</th>
                                    <th>Car Type</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="bookingsTableBody">
                                <!-- Bookings will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-sm-5 py-4 px-md-5 px-3">
        <div class="container-fluid pt-lg-5">
            <div class="row">
                <div class="col-lg-3 col-sm-6 mb-lg-0 mb-5 footer-grid-agileits-w3ls1 text-left">
                    <h3 class="mb-sm-5 mb-4 mt-sm-0 mt-4">About Company</h3>
                    <p>We are providing our services in gadhinglaj. You can book ride with us through our application as well as from our website also.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/jquery-2.1.4.min.js"></script>
    <script src="js/bootstrap.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            
            if (!currentUser) {
                window.location.href = 'userLogin.html';
                return;
            }

            // Display user name
            document.getElementById('userName').textContent = currentUser.fullName;

            // Handle logout
            document.querySelector('.fa-sign-out-alt').parentElement.addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            });

            // Load and display bookings
            const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            const userBookings = bookings.filter(booking => booking.userId === currentUser.id);
            
            const tableBody = document.getElementById('bookingsTableBody');
            if (userBookings.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="8" class="text-center">No bookings found</td></tr>';
            } else {
                tableBody.innerHTML = userBookings.map(booking => `
                    <tr>
                        <td>${booking.id}</td>
                        <td>${booking.pickupLocation}</td>
                        <td>${booking.dropoffLocation}</td>
                        <td>${booking.bookingDate}</td>
                        <td>${booking.bookingTime}</td>
                        <td>${booking.carType}</td>
                        <td>
                            <span class="badge badge-${getStatusBadgeClass(booking.status)}">
                                ${booking.status}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-info" onclick="viewBookingDetails(${booking.id})">
                                <i class="fas fa-eye"></i> View
                            </button>
                            ${booking.status === 'Pending' ? `
                                <button class="btn btn-sm btn-danger" onclick="cancelBooking(${booking.id})">
                                    <i class="fas fa-times"></i> Cancel
                                </button>
                            ` : ''}
                        </td>
                    </tr>
                `).join('');
            }
        });

        function getStatusBadgeClass(status) {
            switch(status.toLowerCase()) {
                case 'pending': return 'warning';
                case 'confirmed': return 'success';
                case 'cancelled': return 'danger';
                case 'completed': return 'info';
                default: return 'secondary';
            }
        }

        function viewBookingDetails(bookingId) {
            const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            const booking = bookings.find(b => b.id === bookingId);
            
            if (booking) {
                alert(`
                    Booking Details:
                    ID: ${booking.id}
                    Pickup: ${booking.pickupLocation}
                    Dropoff: ${booking.dropoffLocation}
                    Date: ${booking.bookingDate}
                    Time: ${booking.bookingTime}
                    Car Type: ${booking.carType}
                    Passengers: ${booking.passengers}
                    Status: ${booking.status}
                    ${booking.specialInstructions ? `Special Instructions: ${booking.specialInstructions}` : ''}
                `);
            }
        }

        function cancelBooking(bookingId) {
            if (confirm('Are you sure you want to cancel this booking?')) {
                const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
                const bookingIndex = bookings.findIndex(b => b.id === bookingId);
                
                if (bookingIndex !== -1) {
                    bookings[bookingIndex].status = 'Cancelled';
                    localStorage.setItem('bookings', JSON.stringify(bookings));
                    alert('Booking cancelled successfully');
                    location.reload();
                }
            }
        }
    </script>
</body>
</html>
